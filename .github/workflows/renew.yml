name: Auto Renew Glass Panel

on:
  schedule:
    # 每天北京时间上午 8:00 (UTC 0:00) 自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在网页手动点 Run 触发测试

jobs:
  renew-job:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: 执行自动续期
        env:
          GLASS_TOKEN: ${{ secrets.GLASS_TOKEN }}
        run: |
          python renew.py
