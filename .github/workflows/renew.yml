name: Auto Renew Glass Panel

on:
  schedule:
    # 改为每 10 天的 UTC 时间 0:00 运行一次（即每月 1日、11日、21日、31日）
    - cron: '0 0 1,11,21,31 * *'
  workflow_dispatch: # 保持支持手动触发

jobs:
  renew-job:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: 执行自动续期
        env:
          GLASS_TOKEN: ${{ secrets.GLASS_TOKEN }}
        run: |
          python renew.py
